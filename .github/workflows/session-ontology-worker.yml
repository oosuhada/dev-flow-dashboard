name: Session ontology worker probe

on:
  push:
    branches:
      - tmp/session-capability-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, dev-flow-dashboard-v2]
    timeout-minutes: 5
    steps:
      - name: Probe ontology checkout and GitHub auth
        shell: bash
        run: |
          set -euo pipefail
          echo "HOST=$(hostname)"
          echo "HOME=$HOME"
          echo "GH=$(command -v gh || true)"
          gh auth status || true
          echo "-- candidate ontology repos --"
          for d in \
            "$HOME/ontology_dashboard" \
            "$HOME/Documents/ontology_dashboard" \
            "$HOME/project/ontology_dashboard" \
            "$HOME/projects/ontology_dashboard" \
            "$HOME/team-repos/ontology_dashboard"; do
            if [ -d "$d/.git" ]; then
              echo "REPO=$d"
              git -C "$d" remote -v | head -4
              git -C "$d" status --short --branch
            fi
          done
          find "$HOME" -maxdepth 6 -type d -name ontology_dashboard 2>/dev/null | head -20 | while read -r d; do
            if [ -e "$d/.git" ]; then
              echo "FOUND=$d"
              git -C "$d" remote -v | head -4 || true
              git -C "$d" status --short --branch || true
            fi
          done
